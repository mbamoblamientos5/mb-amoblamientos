<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#19241a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..600&family=Manrope:wght@500;800&family=Space+Grotesk:wght@500;600&display=swap"
    />
    <script>
      // Antes de pintar: tema guardado (o el del sistema) y animaciones de aparición si corresponde.
      ;(function () {
        var root = document.documentElement
        var theme = null
        try {
          theme = localStorage.getItem('mb-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        root.dataset.theme = theme
        var reduce = matchMedia('(prefers-reduced-motion: reduce)')
        var motion = function () {
          root.classList.toggle('motion', 'IntersectionObserver' in window && !reduce.matches)
        }
        motion()
        reduce.addEventListener('change', motion)
      })()
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
